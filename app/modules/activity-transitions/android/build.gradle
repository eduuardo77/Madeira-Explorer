plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.proa.madeira'
version = '1.0.0'

android {
  namespace "expo.modules.activitytransitions"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  // The same version expo-location already ships, so nothing new is linked.
  implementation 'com.google.android.gms:play-services-location:21.0.1'
}
