plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.proa.madeira'
version = '1.0.0'

android {
  namespace "expo.modules.videoexport"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

// T-329, D-112: no map library here. The video's map is MapLibre GL JS in a
// WebView (`src/main/assets/video3d/`), for its 3D terrain; MapLibre Android
// (11.13.5, 13 MB) had none.
